<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Banking — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3 text-center">Online Banking</h3>
          {% with messages = get_flashed_messages() %}
            {% if messages %}
              <div class="alert alert-warning">
                {% for m in messages %}{{ m }}<br>{% endfor %}
              </div>
            {% endif %}
          {% endwith %}
          <form method="post" action="{{ url_for('login') }}">
            <div class="mb-3">
              <label class="form-label">User ID (numeric)</label>
              <input type="text" name="userid" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label><br>
              <div class="btn-group" role="group" aria-label="role">
                <input type="radio" class="btn-check" name="role" id="roleUser" value="user" autocomplete="off" checked>
                <label class="btn btn-outline-primary" for="roleUser">User</label>

                <input type="radio" class="btn-check" name="role" id="roleEmp" value="employee" autocomplete="off">
                <label class="btn btn-outline-secondary" for="roleEmp">Employee</label>
              </div>
            </div>
            <div class="d-grid">
              <button class="btn btn-primary">Login</button>
            </div>
          </form>

          <hr>
          <div class="text-center small text-muted">Need admin seeded? Visit <code>/setup_seed_admin</code> after running the app.</div>
        </div>
      </div>
      <div class="text-center mt-3 small text-muted">Bootstrap UI • Easy setup</div>
    </div>
  </div>
</div>
</body>
</html>
